# Logging of the desktop app, selected by org.rdfarchitect.desktop.DesktopLauncher. Writes to the
# app's data directory rather than to the working directory, which may not be writable there
# (C:\Program Files) and is not where a user would look.
Configuration:
  Properties:
    Property:
      - name: "logDir"
        value: "${sys:rdfarchitect.desktop.log-dir:-logs}"
  Appenders:
    Console:
      name: "CONSOLE"
      PatternLayout:
        disableAnsi: false
        pattern: "[%d] - %highlight{%-5level} - [%thread] %c{1.} - %msg%n%throwable"
    RollingFile:
      - name: "FILE"
        fileName: "${logDir}/rdfarchitect.log"
        filePattern: "${logDir}/rdfarchitect-%i.log"
        PatternLayout:
          pattern: "[%d{yyyy-MM-dd HH:mm:ss}] - %-5level - [%thread] %c{1.} - %msg%n%throwable"
        DefaultRolloverStrategy:
          max: 5
        # Size only: a second start, which just opens a window of the running app, must not
        # roll over the file the running app still writes to.
        Policies:
          SizeBasedTriggeringPolicy:
            size: "10MB"
  Loggers:
    Root:
      level: "INFO"
      AppenderRef:
        - ref: "CONSOLE"
        - ref: "FILE"
