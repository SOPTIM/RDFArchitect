name: Desktop App

# Builds the desktop app for Windows, macOS and Linux. jpackage only builds for the system it runs
# on, hence one job per platform. A release tag (vX.Y.Z) puts the builds into a draft release, where
# the Windows ones are signed before the release is published, the .msi built in between by
# desktop-windows-installer.yml (see "Releases" in the developer guide). Pushes and pull requests
# build the app when they change the packaging, backend/pom.xml or the desktop-only backend code.
on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    # Tag pushes run whatever the paths below say.
    tags:
      - "v*.*.*"
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
      - ".github/scripts/resolve_version.sh"
      - "backend/pom.xml"
      - "backend/src/desktop/**"
      - "backend/src/main/java/org/rdfarchitect/desktop/**"
      - "backend/src/main/java/org/rdfarchitect/api/controller/desktop/**"
      - "backend/src/main/java/org/rdfarchitect/api/dto/desktop/**"
      - "backend/src/main/java/org/rdfarchitect/services/desktop/**"
      - "backend/src/main/resources/application-desktop.yml"
      - "backend/src/main/resources/log4j2-desktop.yaml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
      - ".github/scripts/resolve_version.sh"
      - "backend/pom.xml"
      - "backend/src/desktop/**"
      - "backend/src/main/java/org/rdfarchitect/desktop/**"
      - "backend/src/main/java/org/rdfarchitect/api/controller/desktop/**"
      - "backend/src/main/java/org/rdfarchitect/api/dto/desktop/**"
      - "backend/src/main/java/org/rdfarchitect/services/desktop/**"
      - "backend/src/main/resources/application-desktop.yml"
      - "backend/src/main/resources/log4j2-desktop.yaml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Resolve build metadata
        run: |
          bash ../.github/scripts/resolve_version.sh >> "$GITHUB_ENV"
      - name: Clean install
        run: npm ci
      - name: Generate API client
        run: npm run api:generate
      - name: Build
        env:
          PUBLIC_APP_VERSION: ${{ env.APP_VERSION }}
        run: npm run build
      - name: Upload user interface
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build
          path: frontend/build
          if-no-files-found: error
          retention-days: 1

  package:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
          - runner: macos-15
            platform: mac-arm64
          - runner: macos-15-intel
            platform: mac-x64
          - runner: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "25"
          cache: maven
      - name: Download user interface
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: frontend/build
      - name: Resolve build metadata
        run: bash .github/scripts/resolve_version.sh >> "$GITHUB_ENV"
      - name: Put the WiX Toolset on the path
        # Installed on the windows-2022 image, but not on the path, where jpackage looks for it.
        if: runner.os == 'Windows'
        shell: pwsh
        run: if ($env:WIX) { Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:WIX "bin") }
      - name: Build portable app
        run: desktop/build.sh --skip-frontend --version "$APP_VERSION"
      - name: Build installer
        # A release builds its .msi only once RDFArchitect.exe is signed
        # (desktop-windows-installer.yml), so that the program it installs is signed as well.
        if: runner.os != 'Windows' || github.ref_type != 'tag'
        # The portable archive is the main download; a runner without the installer tooling
        # (the WiX Toolset on Windows) should not hold it back.
        continue-on-error: true
        run: desktop/build.sh --skip-frontend --skip-backend --installer --version "$APP_VERSION"
      - name: Check the signature check
        # desktop-windows-installer.yml relies on it and runs for releases only, so it is tried
        # here on the unsigned build. Its messages are kept out of the log, being expected.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "desktop/build/image/RDFArchitect/RDFArchitect.exe"
          $null = & desktop/check-signature.ps1 -Path $exe *>&1
          if ($LASTEXITCODE -ne 1) { Write-Host "::error::check-signature.ps1 accepted an unsigned program."; exit 1 }
          $null = & desktop/check-signature.ps1 -Path $exe -AllowUnsigned *>&1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::check-signature.ps1 -AllowUnsigned refused an unsigned program."; exit 1 }
      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}
          path: desktop/dist/*
          if-no-files-found: error

  draft-release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download apps
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Create the draft release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            if [[ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != true ]]; then
              echo "::warning::Release $TAG is published already, so its unsigned Windows downloads are public until they are signed."
            fi
            exit 0
          fi
          # The release notes are the tag's section of the changelog.
          version="${TAG#v}"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$version" --notes-file notes.md
      - name: Attach the apps
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
